<h1>來台灣讀書的外籍學生</h1>

<h2>自我介紹</h2>
<p>
大家好，我叫黎氏線，來自越南。我來台灣已經兩年多了。
因為我喜歡學中文，而且我的姐姐在台灣，所以我決定來台灣學習中文。
</p>

<h2>學習中文的困難</h2>
<p>
剛來台灣的時候，我的中文不太好，也遇到了很多語言上的困難。
對我來說，學中文最難的是漢字。
</p>

<h2>結論</h2>
<p>
我希望未來可以繼續努力，把中文學得更好。
</p>
